[package]
name = "notepad-md"
version = "1.3.0"
description = "A Notepad-like application for viewing and editing Markdown files"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
# Already in the dependency tree (no new download): registry access for file-type registration.
winreg = "0.56"
# Also already in the tree (Tauri uses them): adds "Open link in new window" etc. to WebView2's own
# right-click menu for links in the editor.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62"

[[bin]]
name = "notepad-md"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
